name: github-release

# The version in package.json is bumped on `test` by `pnpm release` (which skips tagging).
# When the test → main PR merges, this workflow tags the merge commit and publishes the
# GitHub Release — but only when this version has no tag yet, so ordinary merges are no-ops.
# Creating a tag adds no commit, so Vercel does not produce a second production build.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and whether it is already tagged
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        if: steps.v.outputs.exists == 'false'
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md

      - name: Tag the merge commit and publish the GitHub Release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
